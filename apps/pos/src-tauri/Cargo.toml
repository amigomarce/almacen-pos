[package]
name = "almacen-pos"
version = "0.1.0"
description = "Caja del Almacén POS (envoltura de escritorio, ADR-005)"
edition = "2021"
publish = false

[lib]
name = "almacen_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# Rutas sin el prefijo \\?\ de Windows para el servidor Node (ya viene con Tauri).
dunce = "1"

# Modo kiosco en Windows (ADR-019): ajustes de WebView2 y hook de teclado. Mismas versiones
# que usa Tauri 2.12.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
