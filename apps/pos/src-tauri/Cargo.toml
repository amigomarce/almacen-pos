[package]
name = "almacen-pos"
version = "0.1.0"
description = "Caja del Almacén POS (envoltura de escritorio, ADR-005)"
edition = "2021"
publish = false

[lib]
name = "almacen_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
