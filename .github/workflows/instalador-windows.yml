name: Instalador Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # La versión sale de "packageManager" en package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/pos/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # La semilla de productos no se versiona: se reconstruye desde los exports de OFF.
      # La caché evita descargar el export completo en cada corrida.
      - uses: actions/cache@v6
        with:
          path: data/raw
          key: off-raw-${{ runner.os }}

      - name: Base semilla
        run: pnpm data:build

      - name: Instalador NSIS
        run: pnpm --filter @almacen/pos tauri build
        env:
          ALMACEN_CLOUD_URL: ${{ vars.ALMACEN_CLOUD_URL }}
          ALMACEN_CONTACTO: ${{ vars.ALMACEN_CONTACTO }}

      # Tests de la envoltura en Windows (incluye las rutas \\?\ que Node no acepta).
      - name: Tests de Rust
        run: cargo test --manifest-path apps/pos/src-tauri/Cargo.toml --release

      # Prueba de humo: la caja compilada debe levantar su servidor. Si Node no arranca (como
      # con las rutas \\?\), el instalador no se publica.
      - name: Prueba de humo del servidor
        shell: pwsh
        run: |
          $exe = "apps/pos/src-tauri/target/release/almacen-pos.exe"
          $app = Start-Process -FilePath $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:3001/health" -TimeoutSec 2
              if ($r.status -eq "ok") { $ok = $true; break }
            } catch {}
          }
          $log = Join-Path $env:APPDATA "cl.almacenpos.caja\server.log"
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Get-Process almacen-node -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw "El servidor de la caja no respondió en 60 s" }
          Write-Host "Servidor de la caja OK"

      - uses: actions/upload-artifact@v7
        with:
          name: instalador-windows
          path: apps/pos/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
